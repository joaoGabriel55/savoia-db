name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A reminder, not a gate: changes users won't notice need no changeset.
      - run: |
          npx changeset status --since=origin/${{ github.base_ref }} \
            || echo "::warning::No changeset in this PR. If users will notice the change, run \`npx changeset\` and commit the file."

  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The benchmarks only build with their feature; keep them compiling.
      - run: cargo clippy -p savoia-app --features bench -- -D warnings
      - run: cargo test --workspace

  live:
    name: Live tests (Postgres, MySQL, SSH)
    needs: checks
    runs-on: ubuntu-latest
    env:
      SAVOIA_PG_URL: postgres://savoia:savoia@127.0.0.1:54317/savoia
      SAVOIA_MYSQL_URL: mysql://savoia:savoia@127.0.0.1:33084/savoia
      SAVOIA_SSH_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The runner's postgresql-client is older than the compose server, and
      # pg_dump refuses to dump a newer server.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - run: docker compose up -d --wait
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo build -p savoia-app --release
